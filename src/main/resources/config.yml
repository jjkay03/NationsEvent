# == Server settings =================================================================================================

# Event code name (Example: NG1)
# Needs to match actual build-in event codename to load event specific classes
event-codename: NS7



# == Player Group Chats ===============================================================================================

# Player group chat feature toggle
player-group-chat-enable: true

# If group chats should be saved and loaded when server restarts
player-group-chat-save-on-server-restart: true

# Maximum amount of GCs a player can join
player-group-chat-limit: 3

# If group chats can be used while chat is disabled
player-group-chat-bypass-disabled-chat: true

# Colors for player group chat messages
player-group-chat-color: "§7"
player-group-chat-spy-color: "§8"
player-group-chat-staff-msg-prefix: "§6[STAFF]"
player-group-chat-name-character-limit: 6