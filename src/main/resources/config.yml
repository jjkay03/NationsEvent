# ----------------------
#  NATIONS EVENT CONFIG
# ----------------------


# == Server settings =================================================================================================

# Event code name (Example: NG1)
event-codename: NE2

# Default players max render distance
render-distance-manager: false
render-distance-default-players: 8

# Resourcepack
# Enable/Disable resourcepack being sent to players
resourcepacks-enable: false
# URL to resourcepack (Packs will be ordered in the opposite order in-game)
resourcepacks-urls: []
# Resourcepack hash (Will be generated by the plugin)
resourcepacks-hashes: []
# List of players that will be exempted from the pack
resourcepacks-players-exempt:
  - jjkay03
  - jjkay02



# == Economy ==========================================================================================================

# Economy feature toggle
economy-enable: true

# Money symbol $
economy-money-symbol: "⛂"
# Money color
economy-money-color: "§e"
# Allow negative balances
economy-allow-negative-balance: true

# Update total balances - run a task and update total balance var every x minutes (used in placeholders)
economy-update-total-balances: true
economy-update-total-balances-interval: 1



# == Gameplay settings ================================================================================================
# Disabled crafts (managed from Saves class)
setting-no-craft: true

# Limited enchants (managed from Saves class)
setting-limit-enchant: true



# == Player Group Chats ===============================================================================================

# Player group chat feature toggle
player-group-chats-enable: true

# If group chats can be used while chat is disabled
player-group-chats-bypass-disabled-chat: false

# Colors for player group chat messages
player-group-chat-color: "§7"
player-group-chat-spy-color: "§8"



# == Features toggle ==================================================================================================
# Make players drop meet on death
feature-meat-player-death: false

# Make it so player with right perm can open iron doors with hands
feature-iron-door: true

# Make it so players and mobs can't trample crops
feature-farm-protection: true

# Make players faster when they are standing on certain blocks
feature-speedy-blocks: false

# Make villagers automatically restock their trades at intervals without the need of daylight cycle
feature-auto-restock-villagers: false



# == Patches ==========================================================================================================
# Prevent players from block glitching
patch-anti-block-glitching: false

# Prevent players from using ender pearls
patch-anti-ender-pearl: false
