# == Main =============================================================================================================

# Event code name (Example: NG1)
# Needs to match actual build-in event codename to load event specific classes
event-codename: NS7



# == Settings =========================================================================================================
settings:
  # Disable certain item crafts
  # Hard coded managed from Saves.kt file
  disable-crafts: true

  # Disable or limit certain enchants
  # Hard coded managed from Saves.kt file
  limit-enchants: true

  # Disable ender pearls usage and obtain
  disable-ender-pearls: true

  # Disable wolf breeding
  disable-wolf-breeding: true

  # Protect farm by disabling trembling
  farm-protection: true

  # Disable join and leave chat messages
  disable-join-leave-messages: true



# == Features =========================================================================================================
features:
  # Ban players on death
  death-ban:
    enable: true
    message: "Your fight is over."
    lightning: false

  # Save all event players IGNs in text file
  event-igns: true

  # Sync multiple worlds settings (first world in the list is the master world)
  worlds-sync:
    enable: false
    enable-time: true
    enable-weather: true
    enable-game-rules: true
    enable-difficulty: true
    worlds: [world, world_test_1, world_test_2]



# == Player Group Chats ===============================================================================================
player-group-chat:
  # Player group chat feature toggle
  enable: true

  # If group chats should be saved and loaded when server restarts
  save-on-server-restart: true

  # Maximum amount of GCs a player can join
  limit: 3

  # If group chats can be used while chat is disabled
  bypass-disabled-chat: true

  # Colors for player group chat messages
  color: "§7"
  spy-color: "§8"
  staff-msg-prefix: "§6[STAFF]"
  name-character-limit: 6